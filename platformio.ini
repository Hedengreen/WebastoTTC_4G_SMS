
[env:esp32]
platform = espressif32
board = esp-wrover-kit
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

board_build.partitions = default.csv

build_flags =
    -DBOARD_HAS_PSRAM

lib_deps =
